<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .detail-label { font-weight: 600; color: #6c757d; width: 180px; display: inline-block; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="container mt-5">
<div class="card" th:if="${ticket != null}">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h3 class="mb-0" th:text="'Ticket Details: #' + ${ticket.tickets}"></h3>

        <!-- Dynamic Badge Color Based on liveStatus -->
        <span class="badge fs-6 shadow-sm"
              th:text="${liveStatus}"
              th:classappend="${liveStatus == 'UPCOMING' ? 'bg-info text-white' :
                           (liveStatus == 'IN PROGRESS' ? 'bg-warning text-dark' :
                           (liveStatus == 'COMPLETED' ? 'bg-success text-white' : 'bg-secondary'))}">
    </span>
    </div>

    <div class="card-body p-4">
        <div class="row mb-4 bg-light p-3 rounded mx-0">
            <div class="col-md-12">
                <small class="text-uppercase text-muted d-block">Creation Date</small>
                <span class="h5" th:text="${ticket.dateCreated}"></span>
            </div>
        </div>

        <h5 class="text-primary border-bottom pb-2">Ticket Specifications</h5>
        <div class="list-group list-group-flush mb-4">
            <div th:each="val : ${ticket.dynamicValues}" class="list-group-item d-flex">
                <span class="detail-label" th:text="${val.fieldDefinition.label} + ':'"></span>
                <span th:text="${val.value}"></span>
            </div>

            <div th:if="${#lists.isEmpty(ticket.dynamicValues)}" class="p-3 text-muted italic">
                No technical details found for this ticket.
            </div>
        </div>
    </div>

    <div class="card-footer bg-white py-3 d-flex justify-content-between">
        <a th:href="@{/tickets/search}" class="btn btn-outline-secondary">&larr; Back to Search</a>
    </div>
</div>
</body>
</html>
