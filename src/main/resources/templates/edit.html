<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Field & Ticket Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="container mt-5">
<div class="card shadow">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h3 class="mb-0">System Configuration (Admin)</h3>
        <span class="badge bg-warning text-dark px-3">Dynamic Mode</span>
    </div>

    <div class="card-body">
        <h5 class="text-primary border-bottom pb-2">Manage Active Fields</h5>
        <form th:action="@{/admin/fields/add}" method="post" class="row g-2 mb-4">
            <div class="col-md-5">
                <input type="text" name="fieldName" class="form-control" placeholder="New Field Name" required>
                <select name="fieldType" class="form-select"> ... </select>            </div>
            <div class="col-md-4">
                <select name="fieldType" class="form-select">
                    <option value="TEXT">Text Input</option>
                    <option value="NUMBER">Number</option>
                    <option value="DATE">Date Picker</option>
                    <option value="TIME">Time Picker</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">+ Add Field</button>
            </div>
        </form>

        <h5 class="text-secondary border-bottom pb-2 mt-4">Current Form Layout Preview</h5>
        <div class="p-4 border rounded bg-light">
            <div class="row" th:if="${not #lists.isEmpty(activeFields)}">
                <div th:each="field : ${activeFields}" class="col-md-6 mb-4">
                    <label class="form-label fw-bold text-dark" th:text="${field.label}"></label>
                    <div class="input-group shadow-sm">
                        <input th:type="${field.fieldType.toLowerCase()}"
                               class="form-control"
                               th:placeholder="'Enter ' + ${field.label}" readonly>

                        <form th:action="@{/admin/fields/delete/{id}(id=${field.id})}" method="post"
                              onsubmit="return confirm('Deleting this field will hide it from the input form. Proceed?');">
                            <button class="btn btn-danger" type="submit">
                                <i class="bi bi-trash"></i> Remove
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(activeFields)}" class="text-center py-4 text-muted">
                <p>No dynamic fields added yet. Use the form above to start building your ticket structure.</p>
            </div>
        </div>
    </div>

    <div class="card-footer text-muted small d-flex justify-content-between">
        <span>MS SQL Database: Connected</span>
        <a th:href="@{/tickets/search}" class="text-decoration-none">Back to Dashboard &rarr;</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
