<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Summary Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f4f3ef;
            --surface: #ffffff;
            --surface-2: #eeede9;
            --border: rgba(0,0,0,0.1);
            --text-primary: #1a1a18;
            --text-secondary: #6b6b67;
            --text-muted: #9b9b96;
            --blue: #185FA5;
            --blue-light: #E6F1FB;
            --green: #3B6D11;
            --green-light: #EAF3DE;
            --amber: #854F0B;
            --amber-light: #FAEEDA;
            --purple: #534AB7;
            --purple-light: #EEEDFE;
            --radius: 10px;
            --radius-sm: 6px;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            font-size: 14px;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-left p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 3px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-right input[type="date"],
        .header-right select {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
        }

        .sep { font-size: 12px; color: var(--text-muted); }

        .btn-load {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            background: var(--text-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-load:hover { opacity: 0.8; }
        .btn-load:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Metric cards */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 1.25rem;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: -1px;
        }

        .metric-value.blue   { color: var(--blue); }
        .metric-value.purple { color: var(--purple); }
        .metric-value.amber  { color: var(--amber); }
        .metric-value.green  { color: var(--green); }

        /* Content row */
        .content-row {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; }

        thead th {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: left;
            padding: 0 10px 8px 0;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        tbody td {
            padding: 9px 10px 9px 0;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            color: var(--text-primary);
        }

        tbody tr:last-child td { border-bottom: none; }

        .ticket-no {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--blue);
        }

        .date-cell { color: var(--text-secondary); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .badge-green  { background: var(--green-light);  color: var(--green); }
        .badge-amber  { background: var(--amber-light);  color: var(--amber); }
        .badge-blue   { background: var(--blue-light);   color: var(--blue); }

        /* Engineer list */
        .engineer-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .engineer-row:last-child { border-bottom: none; }

        .engineer-info { min-width: 90px; }
        .engineer-name { font-size: 13px; font-weight: 500; }
        .engineer-sub  { font-size: 11px; color: var(--text-muted); margin-top: 1px; font-family: 'IBM Plex Mono', monospace; }

        .bar-track {
            flex: 1;
            background: var(--surface-2);
            border-radius: 4px;
            height: 5px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--blue);
            transition: width 0.6s ease;
        }

        .engineer-mp {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 36px;
            text-align: right;
        }

        /* Loading / error states */
        .state-msg {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 13px;
        }

        .error-msg {
            background: #FEF2F2;
            color: #991b1b;
            border: 1px solid #FECACA;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 1rem;
            display: none;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .metric-grid { grid-template-columns: repeat(2, 1fr); }
            .content-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="header">
        <div class="header-left">
            <h1>Ticket Summary</h1>
            <p id="lastUpdated">TicketingDB &mdash; click Load to fetch data</p>
        </div>
        <div class="header-right">
            <input type="date" id="dateFrom" value="">
            <span class="sep">to</span>
            <input type="date" id="dateTo" value="">
            <select id="brandFilter">
                <option value="">All brands</option>
            </select>
            <button class="btn-load" onclick="loadSummary()" id="loadBtn">Load summary</button>
        </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Metric cards -->
    <div class="metric-grid">
        <div class="metric-card">
            <div class="metric-label">Total tickets</div>
            <div class="metric-value blue" id="totalTickets">—</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Total manpower 人天</div>
            <div class="metric-value purple" id="totalManpower">—</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Active tickets</div>
            <div class="metric-value amber" id="activeTickets">—</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Completed tickets</div>
            <div class="metric-value green" id="completedTickets">—</div>
        </div>
    </div>

    <!-- Table + Engineer panel -->
    <div class="content-row">

        <div class="card">
            <div class="card-title">Recent tickets</div>
            <div id="ticketTableWrap">
                <div class="state-msg">Press "Load summary" to fetch tickets.</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Manpower by lead engineer</div>
            <div id="engineerWrap">
                <div class="state-msg">No data yet.</div>
            </div>
        </div>

    </div>
</div>

<script>
    // Set default date range to current month
    (function() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('dateFrom').value = `${y}-${m}-01`;
        document.getElementById('dateTo').value = now.toISOString().split('T')[0];
    })();

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorMsg').style.display = 'none';
    }

    function statusBadge(status) {
        if (!status) return '';
        const s = status.toLowerCase();
        if (s === 'completed') return `<span class="badge badge-green">Completed</span>`;
        if (s === 'in progress') return `<span class="badge badge-amber">In progress</span>`;
        return `<span class="badge badge-blue">${status}</span>`;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function renderTicketTable(tickets) {
        if (!tickets || tickets.length === 0) {
            document.getElementById('ticketTableWrap').innerHTML = '<div class="state-msg">No tickets found.</div>';
            return;
        }
        const rows = tickets.map(t => `
            <tr>
                <td><span class="ticket-no">#${String(t.ticketNo).padStart(4,'0')}</span></td>
                <td class="date-cell">${formatDate(t.date)}</td>
                <td>${t.brand || '—'}</td>
                <td>${t.leadEngineer || '—'}</td>
                <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${t.manpower ?? '—'}</td>
                <td>${statusBadge(t.status)}</td>
            </tr>`).join('');

        document.getElementById('ticketTableWrap').innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Ticket no.</th>
                        <th>Date</th>
                        <th>Brand</th>
                        <th>Lead engineer</th>
                        <th>Manpower</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    function renderEngineers(engineers) {
        if (!engineers || engineers.length === 0) {
            document.getElementById('engineerWrap').innerHTML = '<div class="state-msg">No data.</div>';
            return;
        }
        const max = Math.max(...engineers.map(e => e.totalManpower || 0)) || 1;
        const rows = engineers.map(e => {
            const pct = Math.round((e.totalManpower / max) * 100);
            return `
            <div class="engineer-row">
                <div class="engineer-info">
                    <div class="engineer-name">${e.name}</div>
                    <div class="engineer-sub">${e.ticketCount} tickets</div>
                </div>
                <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                <div class="engineer-mp">${e.totalManpower}</div>
            </div>`;
        }).join('');
        document.getElementById('engineerWrap').innerHTML = rows;
    }

    function loadSummary() {
        hideError();
        const btn = document.getElementById('loadBtn');
        btn.disabled = true;
        btn.textContent = 'Loading...';

        // Set all metric cards to loading state
        ['totalTickets','totalManpower','activeTickets','completedTickets']
            .forEach(id => document.getElementById(id).textContent = '…');

        fetch('/summary/data')
            .then(response => {
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                return response.json();
            })
            .then(data => {
                // Metric cards
                document.getElementById('totalTickets').textContent     = data.totalTickets ?? '—';
                document.getElementById('totalManpower').textContent    = data.totalManpower ?? '—';
                document.getElementById('activeTickets').textContent    = data.activeTickets ?? '—';
                document.getElementById('completedTickets').textContent = data.completedTickets ?? '—';

                // Timestamp
                document.getElementById('lastUpdated').textContent =
                    `TicketingDB — updated ${new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}`;

                // Table + engineer panel
                renderTicketTable(data.recentTickets);
                renderEngineers(data.engineerSummary);

                // Populate brand filter if brands present
                if (data.brands && data.brands.length) {
                    const sel = document.getElementById('brandFilter');
                    sel.innerHTML = '<option value="">All brands</option>' +
                        data.brands.map(b => `<option value="${b}">${b}</option>`).join('');
                }
            })
            .catch(err => {
                showError('Failed to load data: ' + err.message);
                ['totalTickets','totalManpower','activeTickets','completedTickets']
                    .forEach(id => document.getElementById(id).textContent = '—');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Load summary';
            });
    }
</script>

</body>
</html>
