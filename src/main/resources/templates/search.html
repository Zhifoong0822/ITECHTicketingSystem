<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Ticket Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .table-container { min-height: 400px; }
        .search-card { background-color: #f8f9fa; border: 1px solid #dee2e6; }
        .text-id { font-weight: 700; color: #0d6efd; }
        .badge-status { min-width: 110px; display: inline-block; text-align: center; }
    </style>
</head>

<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-speedometer2 text-primary"></i> Ticket Dashboard</h2>
    <div>
        <a th:href="@{/tickets/create}"
           sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_ENGINEER')"
           class="btn btn-success me-2 shadow-sm">
            <i class="bi bi-plus-circle"></i> Create New Ticket
        </a>

        <a href="/admin/fields"
           sec:authorize="hasAuthority('ROLE_ADMIN')"
           class="btn btn-dark shadow-sm">
            <i class="bi bi-gear-fill"></i> Manage System Fields
        </a>

        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</div>
<hr>

<form th:action="@{/tickets/search}" method="get" class="row g-3 mb-4 p-4 search-card rounded shadow-sm">
    <div class="col-md-2">
        <label class="form-label fw-bold">Ticket No</label>
        <input type="number" name="id" th:value="${param.id}" class="form-control" placeholder="ID...">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">Lead Engineer</label>
        <input type="text" name="leadEngineer" th:value="${param.leadEngineer}" class="form-control" placeholder="Search Engineer...">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">Start Date</label>
        <input type="date" name="startDate" th:value="${param.startDate}" class="form-control">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">End Date</label>
        <input type="date" name="endDate" th:value="${param.endDate}" class="form-control">
    </div>
    <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Search</button>
    </div>
</form>

<div class="table-responsive shadow-sm rounded table-container">
    <table class="table table-striped table-hover align-middle" th:if="${tickets != null and !tickets.isEmpty()}">
        <thead class="table-dark">
        <tr>
            <th style="width: 10%">No</th>
            <th style="width: 15%">Date</th>
            <th>Brand</th>
            <th>Lead Engineer</th>
            <th style="width: 15%">Live Status</th>
            <th class="text-center" style="width: 10%">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td class="text-id" th:text="${ticket.ticketNo}"></td>
            <td th:text="${ticket.dateCreated}"></td>

            <td>
                <span th:each="val : ${ticket.dynamicValues}"
                      th:if="${val.fieldDefinition.label.equalsIgnoreCase('Brand')}"
                      th:text="${val.value}"></span>
            </td>

            <td>
                <span th:each="val : ${ticket.dynamicValues}"
                      th:if="${val.fieldDefinition.label.equalsIgnoreCase('Lead Engineer')}"
                      th:text="${val.value}"></span>
            </td>

            <td>
                <div th:with="currentTime=${#temporals.format(#temporals.createNow(), 'HH:mm')}">
                    <th:block th:each="val : ${ticket.dynamicValues}">
                        <th:block th:if="${val.fieldDefinition.label.equalsIgnoreCase('Start Time')}" th:with="startTime=${val.value}">
                            <th:block th:each="val2 : ${ticket.dynamicValues}">
                                <th:block th:if="${val2.fieldDefinition.label.equalsIgnoreCase('End Time')}" th:with="endTime=${val2.value}">
                                    <span th:if="${!#strings.isEmpty(endTime) and currentTime > endTime}" class="badge bg-success badge-status shadow-sm">COMPLETED</span>
                                    <span th:if="${!#strings.isEmpty(startTime) and !#strings.isEmpty(endTime) and currentTime >= startTime and currentTime <= endTime}" class="badge bg-warning text-dark badge-status shadow-sm">IN PROGRESS</span>
                                    <span th:if="${!#strings.isEmpty(startTime) and currentTime < startTime}" class="badge bg-primary badge-status shadow-sm">OPEN</span>
                                </th:block>
                            </th:block>
                        </th:block>
                    </th:block>
                </div>
            </td>

            <td class="text-center">
                <a th:href="@{/tickets/details/{id}(id=${ticket.ticketNo})}" class="btn btn-sm btn-info text-white shadow-sm">
                    <i class="bi bi-eye"></i> View
                </a>
                <form sec:authorize="hasAuthority('ROLE_ADMIN')" th:action="@{/tickets/delete/{id}(id=${ticket.ticketNo})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger shadow-sm ms-1" onclick="return confirm('Delete this ticket?')">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
