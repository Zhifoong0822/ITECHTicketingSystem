<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Ticket Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .table-container { min-height: 400px; }
        .search-card { background-color: #f8f9fa; border: 1px solid #dee2e6; }
        .text-id { font-weight: 700; color: #0d6efd; }
        .badge-status { min-width: 110px; display: inline-block; text-align: center; }
        .modal-content { border-radius: 12px; }
    </style>
</head>

<body class="container mt-5">

<!-- Header Section -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-speedometer2 text-primary"></i> Ticket Dashboard</h2>
    <div>
        <a th:href="@{/tickets/create}"
           sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_ENGINEER')"
           class="btn btn-success me-2 shadow-sm">
            <i class="bi bi-plus-circle"></i> Create New Ticket
        </a>
        <a th:href="@{/admin/fields}"
           sec:authorize="hasAuthority('ROLE_ADMIN')"
           class="btn btn-dark shadow-sm">
            <i class="bi bi-gear-fill"></i> Manage System Fields
        </a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</div>
<hr>

<!-- Search Filters -->
<form th:action="@{/tickets/search}" method="get" class="row g-3 mb-4 p-4 search-card rounded shadow-sm">
    <div class="col-md-2">
        <label class="form-label fw-bold">Ticket No (WO)</label>
        <input type="number" name="workOrder" th:value="${param.workOrder}" class="form-control" placeholder="e.g. 101">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">Lead Engineer</label>
        <input type="text" name="leadEngineer" th:value="${param.leadEngineer}" class="form-control" placeholder="Search Engineer...">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">Start Date</label>
        <input type="date" name="startDate" th:value="${param.startDate}" class="form-control">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">End Date</label>
        <input type="date" name="endDate" th:value="${param.endDate}" class="form-control">
    </div>
    <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Search</button>
    </div>
</form>

<!-- Results Table -->
<div class="table-responsive shadow-sm rounded table-container bg-white">
    <table class="table table-striped table-hover align-middle mb-0" th:if="${tickets != null and !tickets.isEmpty()}">
        <thead class="table-dark">
        <tr>
            <th style="width: 10%">No</th>
            <th style="width: 15%">Date</th>
            <th>Brand</th>
            <th>Lead Engineer</th>
            <th style="width: 15%">Live Status</th>
            <th class="text-center" style="width: 15%">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <!-- Industrial ID Display (Work Order) -->
            <td class="text-id" th:text="${ticket.tickets}"></td>
            <td th:text="${ticket.dateCreated}"></td>

            <!-- Dynamic Values -->
            <td>
                <span th:each="val : ${ticket.dynamicValues}"
                      th:if="${val.fieldDefinition.label.equalsIgnoreCase('Brand')}"
                      th:text="${val.value}"></span>
            </td>
            <td>
                <span th:each="val : ${ticket.dynamicValues}"
                      th:if="${val.fieldDefinition.label.equalsIgnoreCase('Lead Engineer')}"
                      th:text="${val.value}"></span>
            </td>

            <!-- Live Status Column -->
            <!-- Live Status Column -->
            <td>
                <th:block th:with="status=${liveStatusMap[ticket.ticketNo]}">
                    <span th:if="${status == 'COMPLETED'}"   class="badge bg-success badge-status shadow-sm">COMPLETED</span>
                    <span th:if="${status == 'IN PROGRESS'}" class="badge bg-warning text-dark badge-status shadow-sm">IN PROGRESS</span>
                    <span th:if="${status == 'UPCOMING'}"    class="badge bg-info badge-status shadow-sm">UPCOMING</span>
                    <span th:if="${status == 'PENDING DATA' or status == 'UNKNOWN'}" class="badge bg-secondary badge-status shadow-sm" th:text="${status}"></span>
                </th:block>
            </td>

            <td class="text-center">
                <a th:href="@{/tickets/details/{id}(id=${ticket.ticketNo})}" class="btn btn-sm btn-info text-white shadow-sm">
                    <i class="bi bi-eye"></i> View
                </a>
                <button sec:authorize="hasAuthority('ROLE_ADMIN')"
                        type="button"
                        class="btn btn-sm btn-danger shadow-sm ms-1"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                        th:attr="data-id=${ticket.ticketNo}, data-wo=${ticket.tickets}">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Empty State -->
    <div th:if="${tickets == null or tickets.isEmpty()}" class="p-5 text-center text-muted">
        <i class="bi bi-search display-4"></i>
        <p class="mt-3">No matching tickets found.</p>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="bi bi-trash3-fill me-2"></i> Delete Ticket</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 text-center">
                <p class="fs-5">Delete <strong class="text-danger">Ticket #<span id="ticketDisplay"></span></strong>?</p>
                <p class="text-muted small">This action is permanent and cannot be reversed.</p>
            </div>
            <div class="modal-footer bg-light justify-content-center">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form id="deleteForm" method="post">
                    <button type="submit" class="btn btn-danger px-4 shadow-sm">Confirm Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var deleteModal = document.getElementById('deleteModal');
        if (deleteModal) {
            deleteModal.addEventListener('show.bs.modal', function (event) {
                var button = event.relatedTarget;
                var dbId = button.getAttribute('data-id');
                var woId = button.getAttribute('data-wo');

                var deleteForm = document.getElementById('deleteForm');
                deleteForm.action = '/tickets/delete/' + dbId;

                var ticketDisplay = document.getElementById('ticketDisplay');
                ticketDisplay.textContent = woId;
            });
        }
    });
</script>

</body>
</html>
