<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Ticket Search Dashboard</h2>
<hr>

<form th:action="@{/tickets/search}" method="get" class="row g-3 mb-4">
    <div class="col-md-3">
        <label class="form-label">Ticket No</label>
        <input type="number" name="id" th:value="${param.id}" class="form-control" placeholder="Search by ID...">
    </div>
    <div class="col-md-3">
        <label class="form-label">Lead Engineer</label>
        <input type="text" name="leadEngineer" th:value="${param.leadEngineer}" class="form-control" placeholder="Name...">
    </div>
    <div class="col-md-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="startDate" th:value="${param.startDate}" class="form-control">
    </div>
    <div class="col-md-3">
        <label class="form-label">End Date</label>
        <input type="date" name="endDate" th:value="${param.endDate}" class="form-control">
    </div>
    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:href="@{/tickets/search}" class="btn btn-secondary">Reset</a>
    </div>
</form>

<div th:if="${totalTickets != null}">
    <div class="alert alert-info" th:if="${totalTickets > 0}">
        Search Outcome: Found <strong>[[${totalTickets}]]</strong> ticket(s) matching your criteria.
    </div>
    <div class="alert alert-warning" th:if="${totalTickets == 0}">
        Outcome: No tickets found. Please try a different ID, Date, or Engineer.
    </div>
</div>

<table class="table table-striped table-hover" th:if="${tickets != null and !tickets.isEmpty()}">
    <thead class="table-dark">
    <tr>
        <th>No</th>
        <th>Date</th>
        <th>Brand</th>
        <th>DC Room</th>
        <th>Lead Engineer</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.ticketNo}"></td>
        <td th:text="${ticket.date}"></td>
        <td th:text="${ticket.brand}"></td>
        <td th:text="${ticket.dcRoom}"></td>
        <td th:text="${ticket.leadEngineer}"></td>
        <td>
            <a th:href="@{/tickets/details/{id}(id=${ticket.ticketNo})}" class="btn btn-sm btn-info">View Details</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
