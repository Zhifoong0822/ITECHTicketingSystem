<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-speedometer2"></i> Ticket Search Dashboard</h2>
    <div>
        <a th:href="@{/tickets/create}" class="btn btn-success me-2">
            <i class="bi bi-plus-circle"></i> Create New Ticket
        </a>
        <a href="/admin/fields" class="btn btn-dark">
            <i class="bi bi-gear-fill"></i> Manage System Fields
        </a>
    </div>
</div>
<hr>

<form th:action="@{/tickets/search}" method="get" class="row g-3 mb-4 p-3 bg-light border rounded shadow-sm">
    <div class="col-md-2">
        <label class="form-label fw-bold">Ticket No</label>
        <input type="number" name="id" th:value="${param.id}" class="form-control" placeholder="ID...">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">Lead Engineer</label>
        <input type="text" name="leadEngineer" th:value="${param.leadEngineer}" class="form-control" placeholder="Name...">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">Start Date</label>
        <input type="date" name="startDate" th:value="${param.startDate}" class="form-control">
    </div>
    <div class="col-md-3">
        <label class="form-label fw-bold">End Date</label>
        <input type="date" name="endDate" th:value="${param.endDate}" class="form-control">
    </div>
    <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Search</button>
    </div>
    <div class="col-12 mt-2">
        <a th:href="@{/tickets/search}" class="btn btn-link btn-sm text-secondary text-decoration-none">
            <i class="bi bi-arrow-counterclockwise"></i> Reset Filters
        </a>
    </div>
</form>

<div th:if="${totalTickets != null}">
    <div class="alert alert-info py-2" th:if="${totalTickets > 0}">
        <i class="bi bi-info-circle-fill me-2"></i> Found <strong>[[${totalTickets}]]</strong> ticket(s).
    </div>
    <div class="alert alert-warning py-2" th:if="${totalTickets == 0}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> No tickets found. Try different criteria.
    </div>
</div>

<div class="table-responsive shadow-sm rounded">
    <table class="table table-striped table-hover align-middle" th:if="${tickets != null and !tickets.isEmpty()}">
        <thead class="table-dark">
        <tr>
            <th>No</th>
            <th>Date</th>
            <th>Brand</th>
            <th>DC Room</th>
            <th>Lead Engineer</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td class="fw-bold" th:text="${ticket.ticketNo}"></td>
            <td th:text="${ticket.dateCreated}"></td>

            <td>
                        <span th:each="val : ${ticket.dynamicValues}"
                              th:if="${val.fieldDefinition.label == 'Brand'}"
                              th:text="${val.value}"></span>
            </td>

            <td>
                        <span th:each="val : ${ticket.dynamicValues}"
                              th:if="${val.fieldDefinition.label == 'DC Room'}"
                              th:text="${val.value}"></span>
            </td>

            <td>
                        <span th:each="val : ${ticket.dynamicValues}"
                              th:if="${val.fieldDefinition.label == 'Lead Engineer'}"
                              th:text="${val.value}"></span>
            </td>

            <td class="text-center">
                <a th:href="@{/tickets/details/{id}(id=${ticket.ticketNo})}" class="btn btn-sm btn-outline-info">
                    <i class="bi bi-eye"></i> View
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
