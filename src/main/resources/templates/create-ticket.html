<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <i class="bi bi-plus-square-fill me-2"></i>
            <h4 class="mb-0">New Ticket Entry</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/tickets/save}" method="post">

                <div class="mb-4">
                    <label class="form-label fw-bold text-primary">Tickets 工单 (Work Order #)</label>
                    <input type="number"
                           name="ticketsWorkOrder"
                           class="form-control form-control-lg border-primary"
                           min="0"
                           step="1"
                           oninput="if(this.value<0)this.value=Math.abs(this.value)"
                           placeholder="Enter Tickets Number"
                           required> </div>

                <hr class="my-4">

                <div th:each="field : ${activeFields}" class="mb-3">
                    <label class="form-label fw-bold" th:text="${field.label}"></label>

                    <input th:if="${field.fieldType == 'TEXT'}"
                           th:type="text"
                           pattern="[A-Za-z0-9\s]*"
                           th:name="'field_' + ${field.id}"
                           class="form-control"
                           placeholder="Letters and numbers only"
                           required> <input th:if="${field.fieldType == 'NUMBER'}"
                                            th:type="text"
                                            inputmode="numeric"
                                            pattern="[0-9]*"
                                            th:name="'field_' + ${field.id}"
                                            class="form-control"
                                            placeholder="Numbers only (e.g. 123)"
                                            required>   <input th:if="${field.fieldType == 'TIME'}"
                                                             th:type="time"
                                                             th:name="'field_' + ${field.id}"
                                                             class="form-control"
                                                             required> <input th:if="${field.fieldType == 'DATE'}"
                                                                              th:type="date"
                                                                              th:name="'field_' + ${field.id}"
                                                                              class="form-control"
                                                                              required> </div>

                <div class="mt-4 border-top pt-3">
                    <button type="submit" class="btn btn-success px-5 shadow-sm">
                        <i class="bi bi-cloud-arrow-up"></i> Submit Ticket
                    </button>
                    <a th:href="@{/tickets/search}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
