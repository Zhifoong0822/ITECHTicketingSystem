<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">New Ticket Entry</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/tickets/save}" method="post">
                <div th:each="field : ${activeFields}" class="mb-3">
                    <label class="form-label fw-bold" th:text="${field.label}"></label>

                    <input th:type="${field.fieldType != null ? field.fieldType.toLowerCase() : 'text'}"
                           th:name="'field_' + ${field.id}"
                           class="form-control"
                           th:placeholder="'Enter ' + ${field.label}"
                           th:required="${field.isRequired}">
                </div>

                <div class="mt-4 border-top pt-3">
                    <button type="submit" class="btn btn-success px-5">Submit Ticket</button>
                    <a th:href="@{/tickets/search}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
